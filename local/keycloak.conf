#[build options]
cache=local
db=postgres
transaction-xa-enabled=true
features=update-email
http-relative-path=/
health-enabled=true
metrics-enabled=true

#[runtime options]
db-url=jdbc:postgresql://172.18.26.3/keycloak
db-username=postgres
db-password=

log=console
log-console-format=[%d{yyyy-MM-dd HH:mm:ss,SSSz}][%-5p][%c{3.}] (%t) %s%e%n

#proxy-headers=xforwarded
http-enabled=true
http-port=8080
hostname-strict=false

#[email-sender-provider:opfa-cid-embedding]
#spi-email-sender--provider=opfa-cid-embedding

#[events-listener:opfa-login-stats]
#spi-events-listener--opfa-login-stats--attribute=loginStats


#[theme:welcome-theme:opfablank]
spi-theme--welcome-theme=opfablank


#[opfa-sms-client:opfa-sms-client]
#spi-opfa-sms-client--opfa-sms-client--type=placebo
#spi-opfa-sms-client--opfa-sms-client--client-id=AKIASOMETHING
#spi-opfa-sms-client--opfa-sms-client--client-secret=TODO
#spi-opfa-sms-client--opfa-sms-client--region=eu-west-1
#spi-opfa-sms-client--opfa-sms-client--sender-id=SenderId


#[online-access]
online-access--enabled=true
online-access--token-duration=61

#[login:provider]
#custom provider can be disabled using:
#spi-login--opfa-freemarker-configurable--enabled=false
#keys can be registered using the conf-login prefix, they can be referenced in the theme by 
#using ${conf.%}
login-theme-conf--key=value
login-theme-conf--key-with-dash=value-with-dash
login-theme-conf--keyInCamelCase=valueInCamelCase
