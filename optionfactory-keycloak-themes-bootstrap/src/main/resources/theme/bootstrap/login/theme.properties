meta=viewport==width=device-width,initial-scale=1,shrink-to-fit=no format-detection==telephone=no format-detection==email=no

kcHtmlClass=h-100
kcBodyClass=h-100


kcLoginClass=keycloak-container
kcHeaderClass=keycloak-header
kcHeaderWrapperClass=keycloak-header-wrapper
kcFormCardClass=keycloak-card
kcFormHeaderClass=keycloak-form-header

kcLocaleMainClass=keycloak-locale-main
kcLocaleDropDownClass=keycloak-locale-dropdown
kcLocaleListClass=keycloak-locale-list
kcLocaleItemClass=keycloak-locale-item


# these name no rule in this stylesheet, but the values are a dom contract: derived
# themes hook them from their own css and javascript (app-compagnie.js unwraps
# .keycloak-label-wrapper / .keycloak-input-wrapper to build floating labels)
kcContentWrapperClass=keycloak-content-wrapper
kcLabelWrapperClass=keycloak-label-wrapper
kcInputWrapperClass=keycloak-input-wrapper
kcAlertTitleClass=keycloak-alert-title
kcSignUpClass=keycloak-sign-up
kcInfoAreaWrapperClass=keycloak-info-area-wrapper

# do not change: upstream hardcodes class="form-group" in register-commons.ftl and register.ftl
kcFormGroupClass=form-group
kcFormCheckClass=form-check
kcLabelClass=form-label
kcInputClass=form-control
kcTextareaClass=form-control
kcInputErrorMessageClass=invalid-feedback
kcInputHelperTextBeforeClass=form-text
kcInputHelperTextAfterClass=form-text

kcInputClassRadio=form-check
kcInputClassRadioInput=form-check-input
kcInputClassRadioLabel=form-check-label
kcInputClassCheckbox=form-check
kcInputClassCheckboxInput=form-check-input
kcInputClassCheckboxLabel=form-check-label
kcInputClassRadioCheckboxLabelDisabled=disabled
kcCheckboxClass=form-check
kcCheckboxLabelClass=form-check-label

kcFormButtonsWrapperClass=form-actions

kcInputGroup=input-group
kcFormPasswordVisibilityButtonClass=btn
kcFormPasswordVisibilityIconShow=bi bi-eye
kcFormPasswordVisibilityIconHide=bi bi-eye-slash

kcAlertClass=d-flex alert
kcFeedbackSuccessIcon=bi bi-check-circle-fill me-2
kcFeedbackWarningIcon=bi bi-exclamation-circle-fill me-2
kcFeedbackErrorIcon=bi bi-exclamation-circle-fill me-2
kcFeedbackInfoIcon=bi bi-exclamation-circle-fill me-2
kcResetFlowIcon=bi bi-repeat me-2

##### css classes for form buttons
kcButtonClass=btn
kcButtonPrimaryClass=btn-primary
kcButtonDefaultClass=btn-secondary
kcButtonSecondaryClass=btn-outline-secondary
kcButtonLargeClass=
kcButtonBlockClass=w-100 keycloak-button-block
kcMarginTopClass=mt-3

##### css classes for select-authenticator form
kcSelectAuthListClass=list-group
kcSelectAuthListItemClass=list-group-item list-group-item-action d-flex align-items-center gap-3 text-start
kcSelectAuthListItemIconPropertyClass=fs-4
kcSelectAuthListItemHeadingClass=fw-semibold
kcSelectAuthListItemDescriptionClass=small text-body-secondary
# the empty fill div is the spacer upstream puts between the body and the arrow:
# without a grow it collapses and the chevron trails the text, misaligned row to row
kcSelectAuthListItemFillClass=flex-grow-1
kcSelectAuthListItemArrowIconClass=bi bi-chevron-right

##### css classes for the OTP Login Form
kcLoginOTPListClass=keycloak-otp-tile
kcLoginOTPListInputClass=form-check-input
kcLoginOTPListItemHeaderClass=d-flex align-items-center gap-2
kcLoginOTPListItemIconClass=bi bi-phone
kcLoginOTPListItemTitleClass=keycloak-otp-tile-title

##### css classes for the authenticators
kcWebAuthnKeyIcon=bi bi-key
kcWebAuthnDefaultIcon=bi bi-key
kcWebAuthnUnknownIcon=bi bi-key
kcWebAuthnUSB=bi bi-usb-plug
kcWebAuthnNFC=bi bi-broadcast
kcWebAuthnBLE=bi bi-bluetooth
kcWebAuthnInternal=bi bi-key-fill

##### recovery codes
kcRecoveryCodesWarning=alert alert-warning d-flex
kcRecoveryCodesList=list-unstyled row row-cols-2 g-2
kcRecoveryCodesActions=keycloak-recovery-codes-actions d-flex gap-2 flex-wrap
kcCheckInputClass=form-check-input
kcCheckLabelClass=form-check-label
kcCheckboxInputClass=form-check-input



##### social providers
kcFormSocialAccountSectionClass=mt-3
# no bootstrap utilities here: they carry !important and the css would have to answer in kind
kcFormSocialAccountListButtonClass=btn w-100
kcFormSocialAccountListButtonDisabledClass=disabled opacity-50
kcLogoIdP-google=bi bi-google
kcLogoIdP-instagram=bi bi-instagram
kcLogoIdP-facebook=bi bi-facebook
kcLogoIdP-github=bi bi-github
kcLogoIdP-linkedin=bi bi-linkedin
kcLogoIdP-microsoft=bi bi-windows
kcLogoIdP-paypal=bi bi-paypal
kcLogoIdP-stackoverflow=bi bi-stack-overflow
kcLogoIdP-twitter=bi bi-twitter
kcLogoIdP-bitbucket=bi bi-link
kcLogoIdP-gitlab=bi bi-link
kcLogoIdP-openshift-v4=bi bi-link
kcLogoIdP-openshift-v3=bi bi-link
